<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>محاكاة المضيف — اختبار كرة السلة</title>
<style>body{margin:0;font-family:Tahoma,Arial;background:#f6f1f3;color:#222}header{padding:10px 16px;background:#fff;border-bottom:1px solid #e3d6db}#q{position:fixed;inset:auto 0 0;background:#fff;border-top:4px solid #8a1538;padding:16px;display:none;z-index:9}#q.open{display:block}#result{display:none;padding:40px;text-align:center}iframe{width:100%;height:calc(100vh - 60px);border:0;display:block}</style></head>
<body>
<!-- QA host: mirrors the message logic of integration/HOST_REFERENCE.js (excerpt of js/school.js). Not part of the platform. -->
<header>منصة التعلّم التفاعلي · واجب: <b id="hostTitle">لعبة النباتات المائية</b></header>
<section class="football-host"><iframe id="basketballGame" title="كرة السلة" allow="fullscreen;autoplay" allowfullscreen></iframe></section>
<div id="q"><b>سؤال المنصة</b> <span id="qtext"></span> <button onclick="answer('correct')">صحيح</button><button onclick="answer('wrong')">خطأ</button><button onclick="answer('pending')">مقالي</button></div>
<div id="result"><h2 id="resTitle"></h2><p id="resText"></p></div>
<iframe id="sibling" style="display:none" srcdoc="<script>window.attack=()=>{const g=parent.document.getElementById('basketballGame').contentWindow;g.postMessage({type:'school-basketball-result',token:parent.play.sportToken,index:parent.play.index,correct:true},location.origin==='null'?'*':parent.location.origin);}</script>"></iframe>
<script>
const assignment={title:'لعبة النباتات المائية'};
const qs0=new URLSearchParams(location.search);const play={template:'basketball',questions:Array.from({length:+(qs0.get('n')||3)},(_,i)=>({id:i+1})),index:0,answered:false,answerPending:false,sportOutcome:false,sportToken:crypto.randomUUID(),points:0,log:[]};
window.play=play;const qs=new URLSearchParams(location.search);
const frame=document.getElementById('basketballGame');frame.src='../../games/basketball/index.html'+(qs.get('game')||'');
const $=id=>document.getElementById(id);
function renderQuestion(){$('q').classList.add('open');$('qtext').textContent='سؤال رقم '+(play.index+1);play.log.push('question:'+play.index);}
function close(){$('q').classList.remove('open');}
async function answer(kind){if(play.answered||play.answerPending)return;play.answerPending=true;await new Promise(r=>setTimeout(r,50));const r={correct:kind==='correct',pending:kind==='pending',feedback:kind==='correct'?'أحسنت':kind==='pending'?'سيراجع المعلّم إجابتك':'راجع الدرس',explanation:''};play.answered=true;play.points+=kind==='correct'?10:0;play.answerPending=false;close();frame.contentWindow.postMessage({type:'school-basketball-result',token:play.sportToken,index:play.index,correct:r.correct,pending:r.pending,feedback:r.feedback},location.origin);play.log.push('result:'+play.index+':'+kind);}
async function finish(){if(qs.get('failFinish')==='1'&&!play.finishFailedOnce){play.finishFailedOnce=true;throw new Error('network');}play.finished=true;frame.style.display='none';$('result').style.display='block';$('resTitle').textContent=assignment.title;$('resText').textContent='النقاط: '+play.points;play.log.push('finish');}
function run(fn){Promise.resolve().then(fn).catch(e=>play.log.push('error:'+e.message));}
window.addEventListener('message',e=>{const sport=play.template,prefix='school-'+sport+'-';if(!frame||e.origin!==location.origin||e.source!==frame.contentWindow)return;const b=e.data;if(!b||typeof b!=='object')return;play.log.push('recv:'+b.type.replace(prefix,'')+':'+b.index);
 if(b.type===prefix+'ready'){frame.contentWindow.postMessage({type:prefix+'config',title:assignment.title,count:play.questions.length,images:[],token:play.sportToken},location.origin);return;}
 if(b.token!==play.sportToken||b.index!==play.index)return;
 if(b.type===prefix+'question'&&!play.answered&&!play.answerPending)renderQuestion();
 if(b.type===prefix+'outcome'&&play.answered)play.sportOutcome=true;
 if(b.type===prefix+'fullscreen'){play.log.push('fullscreen');}
 if(b.type===prefix+'next'&&play.answered&&play.sportOutcome){play.sportOutcome=false;run(async()=>{if(play.index===play.questions.length-1){try{await finish();}catch(err){play.sportOutcome=true;frame.contentWindow.postMessage({type:prefix+'retry',token:play.sportToken,index:play.index},location.origin);throw err;}}else{const old=play.index;play.index++;play.answered=false;frame.contentWindow.postMessage({type:prefix+'advance',token:play.sportToken,index:old},location.origin);}});}
});
// hostile senders for security checks
window.attackFromHost=()=>{const g=frame.contentWindow;g.postMessage({type:'school-basketball-result',token:'forged',index:play.index,correct:true},location.origin);g.postMessage({type:'school-basketball-result',token:play.sportToken,index:play.index+5,correct:true},location.origin);};
window.attackFromSibling=()=>$('sibling').contentWindow.attack();
window.attackCrossOrigin=()=>{const f=document.createElement('iframe');f.style.display='none';f.src='http://127.0.0.1:8098/attacker.html';document.body.appendChild(f);};
</script></body></html>
