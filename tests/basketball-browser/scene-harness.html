<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#111;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head><body>
<!-- QA harness: deterministic stepping of the basketball scene without UI (used for visual checks, pose checks and timing). Not part of the game. -->
<canvas id="c"></canvas>
<script src="../../games/vendor/three.min.js"></script><script src="../../games/basketball/vendor/GLTFLoader.js"></script><script src="../../games/basketball/vendor/meshopt_decoder.js"></script><script src="../../games/basketball/vendor/SkeletonUtils.js"></script><script src="../../games/basketball/vendor/RoomEnvironment.js"></script>
<script src="../../games/basketball/motion.js"></script><script src="../../games/basketball/athletes.js"></script><script src="../../games/basketball/crowd.js"></script><script src="../../games/basketball/arena.js"></script><script src="../../games/basketball/scene.js"></script>
<script>
const q=new URLSearchParams(location.search);
window.log=[];
const sc=SportScene.create(document.getElementById('c'),{assetBase:'../../games/basketball/assets/',tier:q.get('tier')||'high',preserveDrawingBuffer:true,reducedMotion:q.has('rm'),onEvent:(t,d)=>{window.log.push([performance.now()|0,t,d&&d.result||d&&d.type||'']);}});
window.sc=sc;window.ready=false;
sc.load(p=>{window.progress=p}).then(()=>{window.ready=true;}).catch(e=>{window.loadError=String(e);console.error(e)});
// manual stepping for deterministic screenshots
window.step=(sec,dt=1/60)=>{const r=sc.renderer.render;sc.renderer.render=()=>{};try{for(let t=0;t<sec-1e-9;t+=dt)sc.update(dt);}finally{sc.renderer.render=r;}sc.renderer.render(sc.scene,sc.camera);return sc.snapshot();};
window.until=(cond,max=10,dt=1/60)=>{const r=sc.renderer.render;sc.renderer.render=()=>{};let t=0;try{while(t<max&&!cond(sc.state)){sc.update(dt);t+=dt;}}finally{sc.renderer.render=r;}sc.renderer.render(sc.scene,sc.camera);const s=sc.snapshot();s.waited=+t.toFixed(3);return s;};
window.closeup=(name,dist=3.2,h=1.3,ang=0)=>{const a=sc.people[name];const p=a.root.position;const y=a.yaw+ang;const c=sc.camera;c.position.set(p.x+Math.sin(y)*dist,h,p.z+Math.cos(y)*dist);c.lookAt(p.x,0.95,p.z);c.updateProjectionMatrix();sc.renderer.render(sc.scene,c);return {name,clip:a.currentName,pos:p.toArray().map(x=>+x.toFixed(2)),pel:a.worldOf('Pelvis',new THREE.Vector3()).toArray().map(x=>+x.toFixed(2)),w:a.w,pose:{pel:a.pose.pelvis.toArray(),tilt:a.pose.tilt,bend:a.pose.bend,fL:[a.pose.foot.L.w,a.pose.foot.L.pos.toArray().map(x=>+x.toFixed(2))]}};};
window.brief=s=>({mode:s.mode,tau:+s.tau.toFixed(3),ball:s.ball.map(x=>+x.toFixed(2)),waited:s.waited});
</script></body></html>
