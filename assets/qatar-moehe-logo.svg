<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-label="وزارة التربية والتعليم والتعليم العالي - دولة قطر">
  <defs>
    <linearGradient id="moeMaroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9e1b42"/>
      <stop offset="100%" stop-color="#6d0e2b"/>
    </linearGradient>
    <linearGradient id="moeGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7c675"/>
      <stop offset="50%" stop-color="#c69b3d"/>
      <stop offset="100%" stop-color="#9b721e"/>
    </linearGradient>
  </defs>
  <!-- Emblem Crest on the Right (RTL) -->
  <g transform="translate(432, 12)">
    <circle cx="58" cy="58" r="54" fill="#ffffff" stroke="url(#moeGold)" stroke-width="3.5"/>
    <circle cx="58" cy="58" r="47" fill="none" stroke="#8a1538" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.55"/>
    <!-- Qatari Serrated Band & Open Book / Palm Motif -->
    <path d="M58 20 C75 20 88 33 88 50 C88 68 74 82 58 88 C42 82 28 68 28 50 C28 33 41 20 58 20 Z" fill="url(#moeMaroon)" opacity="0.1"/>
    <!-- Open Book of Knowledge -->
    <path d="M34 66 Q46 58 58 64 Q70 58 82 66 L82 44 Q70 36 58 42 Q46 36 34 44 Z" fill="none" stroke="url(#moeMaroon)" stroke-width="3.2" stroke-linejoin="round"/>
    <line x1="58" y1="42" x2="58" y2="65" stroke="url(#moeGold)" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Rising Sun / Beacon Rays -->
    <path d="M58 23 L58 31 M44 27 L48 34 M72 27 L68 34" stroke="url(#moeGold)" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Base Ribbon -->
    <path d="M32 77 Q58 88 84 77" fill="none" stroke="url(#moeGold)" stroke-width="3.2" stroke-linecap="round"/>
    <text x="58" y="99" text-anchor="middle" font-family="Tajawal, Tahoma, Arial, sans-serif" font-size="11" font-weight="800" fill="#8a1538">دولة قطر</text>
  </g>
  <!-- Vertical Divider -->
  <line x1="414" y1="24" x2="414" y2="116" stroke="url(#moeGold)" stroke-width="2" opacity="0.65"/>
  <!-- Official Bilingual Title -->
  <g text-anchor="end" font-family="Tajawal, 'Segoe UI', Tahoma, Arial, sans-serif">
    <text x="398" y="46" font-size="17" font-weight="800" fill="#8a1538">دولة قطر</text>
    <text x="398" y="76" font-size="22" font-weight="900" fill="#1a1625">وزارة التربية والتعليم والتعليم العالي</text>
    <text x="398" y="103" font-size="11.5" font-weight="700" fill="#6b5e65" letter-spacing="0.4">MINISTRY OF EDUCATION AND HIGHER EDUCATION</text>
  </g>
</svg>
