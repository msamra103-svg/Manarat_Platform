[build]
  command = "echo No build needed"
  publish = "."

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/public/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/admin"
  to = "/admin/admin.html"
  status = 200

[[redirects]]
  from = "/teacher"
  to = "/teacher/dashboard.html"
  status = 200

[[redirects]]
  from = "/player"
  to = "/player/game.html"
  status = 200

[[redirects]]
  from = "/auth"
  to = "/auth.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
