name: Validate classroom session hotfix
on:
  push:
    branches: [fix/classroom-session-auth-20261111]
    paths:
      - scripts/repair-classroom-auth.cjs
      - tests/classroom-auth.test.cjs
      - tests/classroom-auth-browser.cjs
      - .github/workflows/classroom-auth-hotfix.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'msamra103-svg/Manarat_Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reproduce missing classroom authorization before repair
        run: |
          if node --test --test-name-pattern='group start sends' tests/classroom-auth.test.cjs; then
            echo 'The original regression did not reproduce; stop for review.'
            exit 1
          fi
      - name: Apply narrowly scoped source repair
        run: node scripts/repair-classroom-auth.cjs
      - name: Install locked dependencies and build production mirrors
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Syntax and authorization regression tests
        run: |
          node --check js/school.js
          node --check public/js/school.js
          node --test tests/classroom-auth.test.cjs
      - name: Existing regression coverage
        run: |
          npm run check:js
          npm run test:unit
          node tests/admin-requests.cjs
          node tests/game-session.cjs
          node tests/game-modes.cjs
          node tests/school-api.cjs
      - name: Browser verification
        run: |
          npx --no-install playwright install --with-deps chromium
          node tests/classroom-auth-browser.cjs
      - name: Save tested files on the isolated repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/school.js public/js/school.js index.html public/index.html package.json
          git diff --cached --check
          git commit -m 'Fix classroom start authentication and retain anonymous homework'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/fix/classroom-session-auth-20261111
          unset GIT_CONFIG_VALUE_0
          echo '## Tested classroom session repair' >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
