name: Verify published classroom session repair
on:
  push:
    branches: [fix/classroom-session-auth-20261111]
    paths: [.github/workflows/classroom-auth-hotfix.yml]
permissions:
  contents: read
jobs:
  verify-production:
    if: github.repository == 'msamra103-svg/Manarat_Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compare public production assets with the tested repair
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const origin='https://manarat-ten.vercel.app';
          const expected=fs.readFileSync('js/school.js','utf8');
          const hash=s=>createHash('sha256').update(s).digest('hex');
          const marker='js/school.js?v=21.12-classroom-auth';
          assert(expected.includes("const classroomStart=action==='start'"));
          let verified=false;
          for(let attempt=1;attempt<=6;attempt++){
            try{
              const page=await fetch(origin+'/index.html?verify=classroom-auth-'+Date.now(),{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
              assert.equal(page.status,200,'Production HTML status');
              const html=await page.text();
              assert(html.includes('مدرسة أبو عبيدة الإعدادية للبنين'),'Correct school identity');
              assert(html.includes(marker),'Production HTML loads the new cache version');
              const script=await fetch(origin+'/'+marker,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
              assert.equal(script.status,200,'Production JavaScript status');
              const actual=await script.text();
              assert.equal(hash(actual),hash(expected),'Published JavaScript equals tested source');
              console.log('PASS production school identity, HTTP 200, cache version 21.12-classroom-auth and exact tested source hash:',hash(actual));
              console.log('Verified public production origin:',origin);
              verified=true;break;
            }catch(error){console.log('Production verification attempt',attempt,':',error.message);if(attempt<6)await new Promise(resolve=>setTimeout(resolve,10000));}
          }
          if(!verified)throw new Error('Production asset verification failed');
          NODE
