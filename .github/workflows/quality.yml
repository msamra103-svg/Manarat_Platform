name: School V19 Quality Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
      - name: Build static platform and extract local game assets
        run: npm run build
      - name: Validate platform files
        run: node scripts/smoke-check.js
      - name: Verify Abu Ubaida light theme and identity
        run: node tests/abu-ubaida-theme.cjs

      - name: Check school authorization and grading
        run: node tests/school-api.cjs

      - name: Verify mid-flight question and graded arrow trajectory
        run: node tests/target-shooting-guided-trajectory.cjs

      - name: Verify four selectable 3D shooting modes with mid-flight questions
        run: node tests/target-shooting-four-modes.cjs
