name: Bowling V20 Verified Import
on:
  push:
    branches: [main]
    paths:
      - 'bundles/bowling-v20-delta/part-03.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bowling-v20-reviewed-import
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify imported Bowling V20 package and install files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, pathlib, shutil, zipfile
          root = pathlib.Path('.')
          pieces = [root / ('bundles/bowling-v20-delta/part-%02d.b64' % i) for i in range(4)]
          if any(not p.is_file() for p in pieces):
              raise SystemExit('Missing transfer piece')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in pieces)
          if len(encoded) != 481436:
              raise SystemExit('Unexpected archive encoding length')
          binary = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(binary).hexdigest()
          expected = 'b35333db07b2d4e32b647969b6e177ae7f3992b4be7ee968292b386ded652718'
          if digest != expected:
              raise SystemExit('Archive checksum verification failed')
          # The package contains only bowling-specific code, new bowling shirt textures,
          # and its tests. The other 52 source assets exactly match the existing basketball assets.
          shutil.copytree('games/basketball/assets', 'games/bowling/assets', dirs_exist_ok=True)
          shutil.copytree('games/basketball/vendor', 'games/bowling/vendor', dirs_exist_ok=True)
          exact = {'tests/bowling-physics.cjs','tests/bowling-motion.cjs',
                   'tests/bowling-rig.cjs','tests/bowling-flow.cjs'}
          required = {'games/bowling/index.html','games/bowling/game.js',
                      'games/bowling/physics.js','games/bowling/scene.js',
                      'games/bowling/assets/textures/bowler_kit.jpg',
                      'games/bowling/assets/textures/bowler_kit_alt.jpg',
                      *exact}
          copied = set()
          with zipfile.ZipFile(io.BytesIO(binary)) as archive:
              for member in archive.infolist():
                  if member.is_dir():
                      continue
                  name = member.filename
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or '\\' in name:
                      raise SystemExit('Invalid archive path: '+name)
                  mode = (member.external_attr >> 16) & 0o170000
                  if mode == 0o120000:
                      raise SystemExit('No symlinks allowed')
                  if not (name.startswith('games/bowling/') or
                          name.startswith('tests/browser/') or
                          name.startswith('tests/lib/') or name in exact):
                      raise SystemExit('Unexpected archive file: '+name)
                  target = root/name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(member) as src, target.open('wb') as dest:
                      shutil.copyfileobj(src, dest)
                  copied.add(name)
          if not required.issubset(copied):
              raise SystemExit('Missing files: '+repr(required-copied))
          for rel in ('games/bowling/assets/models/athlete_a.glb',
                      'games/bowling/assets/fonts/Tajawal-Bold.woff2',
                      'games/bowling/assets/crowd/crowd_anim.bin',
                      'games/bowling/vendor/GLTFLoader.js'):
              if not (root/rel).is_file():
                  raise SystemExit('Missing shared asset: '+rel)
          pkg = root/'package.json'
          data = json.loads(pkg.read_text(encoding='utf-8'))
          data['scripts']['test:bowling'] = (
              'node tests/bowling-physics.cjs && node tests/bowling-motion.cjs && '
              'node tests/bowling-rig.cjs && node tests/bowling-flow.cjs')
          pkg.write_text(json.dumps(data, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          old = root/'tests/bowling-scene.cjs'
          if old.exists():
              old.unlink()
          print('PASS Bowling V20 checksum; installed',len(copied),'package files and 52 identical shared assets.')
          PY

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify new bowling physics, player motion, 3D rig and platform contract
        run: npm run test:bowling

      - name: Build public deployment and check all mirrored assets
        run: |
          npm run build
          npm run check
          npm run test:unit

      - name: Check no other games were modified
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['git','diff','--name-only'], capture_output=True, text=True, check=True)
          allowed = ('games/bowling/','public/games/bowling/','tests/bowling-',
                     'tests/lib/','tests/browser/','package.json')
          unexpected = [p for p in result.stdout.splitlines() if not p.startswith(allowed)]
          if unexpected:
              raise SystemExit('Unexpected changes outside bowling: '+str(unexpected))
          PY

      - name: Commit tested Bowling V20 to main
        shell: bash
        run: |
          git add -A -- games/bowling/ public/games/bowling/ tests/bowling-physics.cjs tests/bowling-motion.cjs tests/bowling-rig.cjs tests/bowling-flow.cjs tests/lib/ tests/browser/ package.json
          git rm -f --ignore-unmatch tests/bowling-scene.cjs
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(bowling): deploy verified realistic V20 game'
          git push origin HEAD:main
