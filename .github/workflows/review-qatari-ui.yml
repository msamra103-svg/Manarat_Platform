name: Review and integrate Qatar UI safely
on:
  push:
    branches: [review/qatari-ui-20261111]
    paths: ['.review-ui/**', '.github/workflows/review-qatari-ui.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'msamra103-svg/Manarat_Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Materialize and review limited UI integration
        run: |
          git fetch --depth=1 origin 070fedaefed768135c58cb3d25c95a03fa64c01a
          python3 .review-ui/install.py
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('ui-redesign').glob('*'):
            if p.is_file():p.write_text('\n'.join(line.rstrip() for line in p.read_text().splitlines())+'\n')
          p=Path('.review-ui/browser.cjs');s=p.read_text()
          start=s.index("'data:image/svg+xml,'+encodeURIComponent(")
          end=s.index(';__uiMock.db.settings.showMinistryLogo=true',start)
          s=s[:start]+"(()=>{const c=document.createElement('canvas');c.width=200;c.height=50;c.getContext('2d').fillRect(0,0,200,50);return c.toDataURL('image/png');})()"+s[end:]
          s=s.replace('showMinistryLogo=true;__uiMock.save()', 'showMinistryLogo=true;__uiMock.db.settings.design.showMinistry=true;__uiMock.save()')
          s=s.replace('showMinistryLogo=false;__uiMock.save()', 'showMinistryLogo=false;__uiMock.db.settings.design.showMinistry=false;__uiMock.save()')
          s=s.replace("startsWith('data:image/svg+xml')","startsWith('data:image/png')")
          p.write_text(s)
          PY
      - name: Locked build and existing regression tests
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run check:js
          npm run test:unit
          node tests/admin-requests.cjs
          node tests/game-session.cjs
          node tests/game-modes.cjs
          node tests/school-api.cjs
          node tests/admin-contract.cjs
      - name: Compare design suite with the unchanged production baseline
        run: |
          git worktree add --detach /tmp/abu-ui-baseline 070fedaefed768135c58cb3d25c95a03fa64c01a
          ln -s "$PWD/node_modules" /tmp/abu-ui-baseline/node_modules
          python3 - <<'PY'
          import subprocess,re,json
          from pathlib import Path
          out=Path('.review-ui/results');out.mkdir(exist_ok=True)
          failures={}
          for name,cwd in [('baseline','/tmp/abu-ui-baseline'),('integrated','.')]:
            r=subprocess.run(['node','--test','--test-reporter=tap','tests/design-studio.test.cjs'],cwd=cwd,capture_output=True,text=True)
            (out/(name+'-design.tap')).write_text(r.stdout+'\n'+r.stderr)
            failures[name]=re.findall(r'^not ok \d+ - (.+)$',r.stdout,re.M)
            assert r.returncode==0 or failures[name],r.stderr
          expected=['Puzzle stays assignment-only and full names require explicit approval']
          assert failures['baseline']==failures['integrated'],failures
          assert failures['baseline'] in [[],expected],failures
          (out/'baseline-comparison.json').write_text(json.dumps(failures,indent=2))
          print('PASS no new design-suite regressions; baseline failures:',failures['baseline'])
          PY
      - name: Browser authentication and integrated UI tests
        run: |
          npx --no-install playwright install --with-deps chromium
          node tests/classroom-auth-browser.cjs
          node .review-ui/browser.cjs
      - name: Save test reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qatari-ui-review-results
          path: .review-ui/results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit only tested integration on review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'review/qatari-ui-20261111'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-redesign public/ui-redesign index.html public/index.html admin/admin.html public/admin/admin.html teacher/create-game.html public/teacher/create-game.html js/design-runtime.js public/js/design-runtime.js js/design-studio.js public/js/design-studio.js js/school-bridge.js public/js/school-bridge.js scripts/sync-public.js scripts/smoke-check.js
          git diff --cached --check
          git commit -m 'Integrate reviewed Qatari UI layer and safe presentation fixes'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/review/qatari-ui-20261111
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git rev-parse HEAD
