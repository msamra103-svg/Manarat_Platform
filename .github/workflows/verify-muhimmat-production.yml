name: Verify published Mission of Knowledge without writes
on:
  push:
    branches: [review/muhimmat-knowledge-20261115]
    paths: ['.github/workflows/verify-muhimmat-production.yml']
permissions:
  contents: read
jobs:
  public-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3c5ba12cb0344b9e5ad3ac9d17aad4de49050d0c
          persist-credentials: false
      - name: Confirm exact public asset hashes and backend catalog
        run: |
          mkdir -p verification
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const base='https://manarat-ten.vercel.app';
          const paths=['index.html','js/school.js','js/mm-host.js','js/design-schema.js','js/game-covers.js','games/muhimmat-almaarifa/index.html','games/muhimmat-almaarifa/school-bridge.js','games/muhimmat-almaarifa/school-only.css','assets/game-covers/muhimmat-almaarifa.20261115.jpg'];
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const checks=[];
          (async()=>{
            for(const path of paths){
              const response=await fetch(base+'/'+path+'?verify=mm-20261115-'+Date.now(),{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(25000)});
              assert.equal(response.status,200,path);
              const actual=Buffer.from(await response.arrayBuffer());
              assert.equal(hash(actual),hash(fs.readFileSync(path)),'Published bytes differ: '+path);
              checks.push({path,status:200,sha256:hash(actual)});
            }
            const script=fs.readFileSync('js/school.js','utf8');
            const match=script.match(/const KEY='([^']+)'/);
            assert(match,'Missing publishable key');
            const response=await fetch('https://yltlzogrhwvnmxcnaesu.supabase.co/functions/v1/school-api',{
              method:'POST',headers:{'Content-Type':'application/json',apikey:match[1]},body:JSON.stringify({action:'settings'}),signal:AbortSignal.timeout(30000)});
            const settings=await response.json();
            assert(response.ok,JSON.stringify(settings).slice(0,250));
            assert(settings.design?.gameOrder?.includes('muhimmat-almaarifa'),'Backend design schema lacks new game');
            checks.push({path:'school-api settings/read-only',status:response.status,gameInCatalog:true});
            fs.writeFileSync('verification/production-assets.json',JSON.stringify({status:'PASS',checks,release:'3c5ba12cb0344b9e5ad3ac9d17aad4de49050d0c',realAccountLogin:false,studentDataWrite:false},null,2));
            console.log('PASS exact live assets and production school API catalog');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Install locked Chromium browser
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Verify actual public card and 3D demo iframe
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),fs=require('node:fs'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const result={status:'PASS',checks:[],studentDataWrites:0};
            try{
              const page=await browser.newPage({viewport:{width:1440,height:900}});
              await page.route('**/*',route=>{
                const request=route.request();
                if(request.url().includes('/functions/v1/school-api')&&request.method()==='POST'){
                  let action='';try{action=request.postDataJSON()?.action||''}catch{}
                  if(!['settings','homeHub'].includes(action)){result.studentDataWrites++;return route.abort();}
                }
                return route.continue();
              });
              await page.goto('https://manarat-ten.vercel.app/index.html',{waitUntil:'domcontentloaded'});
              await page.locator('#gamesGallerySection').waitFor({timeout:30000});
              await page.getByText('مهمّة المعرفة',{exact:true}).first().waitFor({timeout:30000});
              result.checks.push('public homepage card visible');
              await page.goto('https://manarat-ten.vercel.app/index.html?demo=muhimmat-almaarifa',{waitUntil:'domcontentloaded'});
              await page.locator('iframe[src*="muhimmat-almaarifa"]').first().waitFor({timeout:30000});
              const frame=page.frameLocator('iframe[src*="muhimmat-almaarifa"]').first();
              await frame.locator('body.mm-school-mode').waitFor({timeout:90000});
              const state=await frame.locator('body').evaluate(()=>({renderer:!!window.__mmSchoolGame?.renderer,debug:!!window.__mmTest}));
              assert(state.renderer&&!state.debug,JSON.stringify(state));
              assert.equal(result.studentDataWrites,0);
              result.checks.push('real embedded WebGL game, school bridge, no debug or write');
              fs.writeFileSync('verification/production-browser.json',JSON.stringify(result,null,2));
              console.log('PASS live game card and no-write WebGL demo');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: muhimmat-production-verification
          path: verification/
          retention-days: 7
          if-no-files-found: ignore
