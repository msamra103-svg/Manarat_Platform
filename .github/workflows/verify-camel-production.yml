name: Verify published Qatar camel race
on:
  push:
    branches: [review/camel-race-20261113]
    paths: [.github/workflows/verify-camel-production.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RELEASE_SHA: e2333c9d2fcd8d2aa4860b2cfce73a558ad3eacd
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e2333c9d2fcd8d2aa4860b2cfce73a558ad3eacd
          persist-credentials: false
      - name: Install locked browser tools
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Verify exact published source, catalog, homepage and public race
        run: |
          cat > verify-camel-live.cjs <<'NODE'
          'use strict';
          const fs=require('node:fs'),assert=require('node:assert/strict'),{createHash}=require('node:crypto'),{chromium}=require('playwright');
          const site='https://manarat-ten.vercel.app',key='qatar-camel-race',out='camel-production-verification';fs.mkdirSync(out,{recursive:true});
          const report={commit:process.env.RELEASE_SHA,checks:[],errors:[],blockedWrites:[],realAccountLoginPerformed:false,studentDataWritten:false};
          const sha=b=>createHash('sha256').update(b).digest('hex');
          (async()=>{let browser;try{
           const paths=['index.html','js/school.js','js/camel-race-host.js','js/design-schema.js','js/design-studio.js','js/game-covers.js','js/homepage-hub-logic.js','games/qatar-camel-race/index.html','games/qatar-camel-race/game.js','games/qatar-camel-race/game.css','games/qatar-camel-race/game.config.js','assets/game-covers/qatar-camel-race.20261113.jpg'];
           for(const p of paths){const r=await fetch(site+'/'+p+'?verify=camel-'+Date.now(),{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(25000)});assert.equal(r.status,200,p);const b=Buffer.from(await r.arrayBuffer());assert.equal(sha(b),sha(fs.readFileSync(p)),p+' source differs');report.checks.push({file:p,status:200,sha256:sha(b)});}
           const code=fs.readFileSync('js/school.js','utf8');const endpoint=code.match(/const endpoint='([^']+)'/)[1],apikey=code.match(/const KEY='([^']+)'/)[1];
           const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',apikey},body:JSON.stringify({action:'settings'}),signal:AbortSignal.timeout(25000)});assert.equal(response.status,200);const config=await response.json();assert(config.design.gameOrder.includes(key));assert(config.design.games[key]);report.backendCatalogIncludesCamel=true;
           browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
           await ctx.addInitScript(()=>{if(location.pathname.includes('/games/qatar-camel-race/')){const u=new URL(location.href);u.searchParams.set('capture','1');u.searchParams.set('quality','low');u.searchParams.set('reducedMotion','1');history.replaceState(null,'',u.href);}});
           const page=await ctx.newPage();page.on('pageerror',e=>report.errors.push(e.message));
           await ctx.route('**/*',route=>{const req=route.request(),u=new URL(req.url());if(u.hostname.endsWith('.supabase.co')&&req.method()==='POST'){let b={};try{b=req.postDataJSON();}catch{}if(!['settings','homeHub'].includes(b.action)){report.blockedWrites.push(b.action||u.pathname);return route.abort();}}if(u.hostname.endsWith('.supabase.co')&&!['GET','HEAD','OPTIONS','POST'].includes(req.method())){report.blockedWrites.push(req.method());return route.abort();}return route.continue();});
           for(const width of [1440,390]){await page.setViewportSize({width,height:1000});await page.goto(site+'/',{waitUntil:'domcontentloaded'});const card=page.locator('#gamesGallerySection [data-game="qatar-camel-race"]');await card.locator('a[href*="demo=qatar-camel-race"]').waitFor({timeout:40000});assert((await card.innerText()).includes('سباق الهجن القطري'));assert(!(await card.innerText()).includes('undefined'));assert((await card.locator('img').getAttribute('src')).includes('qatar-camel-race'));report.checks.push({page:'live homepage',width,camelCardVisible:true,cardTextComplete:true});}
           await page.setViewportSize({width:1366,height:1000});await page.goto(site+'/?demo=qatar-camel-race',{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>document.querySelector('#camelRaceFrame')?.contentWindow?.QatarCamelRace?.debug?.state==='ready',null,{timeout:60000});const frame=page.frames().find(f=>f.url().includes('/games/qatar-camel-race/'));assert(frame);
           assert.equal(await frame.locator('#qcr-player-name').count(),1);assert.equal(await frame.locator('#qcr-team-name:visible,#qcr-students:visible').count(),0);await frame.locator('#qcr-player-name').fill('نجم');await frame.locator('[data-action="start"]').click();
           const expected=['شاهين','برق','سهيل','رعد','غيث','نجم'];
           for(let i=0;i<3;i++){
             await frame.evaluate(()=>QatarCamelRace.debug.advance(11));await frame.waitForFunction(()=>QatarCamelRace.debug.state==='question');
             assert.equal(await frame.locator('.qcr-q-count').innerText(),'السؤال '+String(i+1).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])+' من ٣');
             const names=await frame.locator('.qcr-board .nm').allTextContents();for(const name of expected)assert(names.includes(name));
             await frame.locator('.qcr-choice[data-choice-id="0"]').click();await frame.waitForFunction(()=>QatarCamelRace.debug.state==='feedback');await frame.locator('[data-action="continue"]').click();
           }
           await frame.evaluate(()=>QatarCamelRace.debug.advance(12));await frame.waitForFunction(()=>QatarCamelRace.debug.state==='results');
           await frame.waitForFunction(()=>!document.querySelector('.qcr-r-save').textContent.includes('جارٍ')&&document.querySelector('.qcr-r-save').textContent.length>0);
           const order=await frame.locator('.qcr-r-order').innerText();for(const name of expected)assert(order.includes(name));assert((await frame.locator('.qcr-r-save').innerText()).includes('لم تُسجّل'));assert.equal(await frame.locator('#qcr-r-title').innerText(),'سباق الهجن القطري');
           assert.deepEqual(report.blockedWrites,[]);assert.deepEqual(report.errors,[]);report.liveDemoFinished=true;report.liveCompetitorNamesVerified=true;report.playerOnlyRenameVerified=true;report.status='PASS';console.log('PASS exact published source, live backend catalog, desktop/mobile camel card, player-only naming and three-question public race. No real student results written.');
           }catch(e){report.status='FAIL';report.failure=e.stack;console.error(e);process.exitCode=1;}finally{fs.writeFileSync(out+'/report.json',JSON.stringify(report,null,2));if(browser)await browser.close();}})();
          NODE
          node verify-camel-live.cjs
      - name: Preserve production verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: camel-production-verification
          path: camel-production-verification/
          if-no-files-found: ignore
          retention-days: 7
