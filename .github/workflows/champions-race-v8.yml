name: Champions Race V8 Integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and extract local 3D race assets
        run: npm run build
      - name: Validate race integration and integrity
        run: npm run test:race-v8
      - name: Validate basketball motion and assessment boundaries
        run: node tests/basketball-motion-v22.cjs && node tests/basketball-scene-v22.cjs && npm run test:sports
      - name: Validate whole site assets and links
        run: npm run check
      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium
      - name: Validate school API and grading
        run: npm run test:school
