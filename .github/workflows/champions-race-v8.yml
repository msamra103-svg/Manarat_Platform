name: Champions Race V8 Integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and extract local 3D race assets
        run: npm run build
      - name: Validate race integration and integrity
        run: npm run test:race-v8
      - name: Validate whole site assets and links
        run: npm run check
      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium
      - name: Validate basketball physics, anatomy and platform grading
        run: npm run test:basketball && node tests/basketball-integration.cjs
      - name: Validate basketball browser flows and mobile controls
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 >/tmp/basketball-server.log 2>&1 &
          SERVER_PID=$!
          python3 -m http.server 8098 --bind 127.0.0.1 --directory tests/basketball-browser/attacker >/tmp/basketball-attacker.log 2>&1 &
          ATTACKER_PID=$!
          trap 'kill "$SERVER_PID" "$ATTACKER_PID"' EXIT
          node tests/basketball-browser/basketball-e2e.cjs
      - name: Validate school API and grading
        run: npm run test:school

      - name: Validate football engine, browser and platform bridge
        run: npm run test:football
      - name: Validate shared sports regression
        run: npm run test:sports
