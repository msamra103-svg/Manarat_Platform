name: Review and build updated horse race v1.1
on:
  push:
    branches: [review/horse-v11-safe-20261117]
    paths: [.github/workflows/horse-v11-review.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'msamra103-svg/Manarat_Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore only reviewed horse motion sources from SHA-256 verified overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          parts=sorted(Path('.horse-v11-review').glob('payload-*.b64'))
          assert len(parts)==6, 'Missing payload segments'
          raw=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='4072087a8251c936c9e69b5e16d3253a761fe531bd6bd641bf7088934545cfee','Unexpected source digest'
          allowed={'src/main.js','src/horse/horseAnimator.js','src/horse/horseSculpt.data.js','src/horse/horseAnatomy.js','src/horse/horseBuilder.js','src/config/config.js','tools/sculpt/build-horse.mjs','tools/sculpt/horseSculpt.mjs','tools/dev/filmstrip.py','tools/dev/motion_clip.py','package.json'}
          root=Path('game-sources/horse-jumping-race')
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
           assert set(z.namelist())==allowed,'Unexpected files in source overlay'
           assert z.testzip() is None,'Corrupted overlay archive'
           for name in z.namelist():
            target=root/name
            assert target.resolve().is_relative_to(root.resolve()),'Illegal path'
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(z.read(name))
          print('Applied verified version 1.1 files:',len(allowed))
          # Explicit strict platform contract from the published 1.0 release remains unchanged.
          bridge=(root/'src/integration/postMessageBridge.js').read_text()
          cfg=(root/'src/config/config.js').read_text()
          controller=(root/'src/game/gameController.js').read_text()
          assert 'if (ev.source !== this.target) return;' in bridge
          assert "m.type!=='platform:init' && m.sessionId!==this.sessionId" in bridge
          assert "p.get('school')==='1'" in cfg and 'cfg.questions.maxQuestions=100;' in cfg
          assert 'this.bridge.requestRestart()' in controller
          assert '1.1.0' in (root/'package.json').read_text()
          print('PASS security guards, original score contract and new-session restart')
          PY
      - name: Cache-bust the new version without altering game assignments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/school.js');s=p.read_text()
          before='games/horse-jumping-race/index.html?school=1&v=20261117-horse'
          after='games/horse-jumping-race/index.html?school=1&v=20261117-horse-v11'
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          p=Path('index.html');s=p.read_text()
          before='js/school.js?v=21.17-horse-20261117'
          after='js/school.js?v=21.18-horse-v11-20261117'
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          # Keep the test's precise cache assertion synchronized with the new source.
          p=Path('tests/classroom-auth.test.cjs');s=p.read_text()
          old=r'js\/school\.js\?v=21\.17-horse-20261117'
          new=r'js\/school\.js\?v=21\.18-horse-v11-20261117'
          assert s.count(old)==1,'Existing cache version test changed'
          p.write_text(s.replace(old,new))
          PY
      - name: Install pinned lock dependencies and rebuild revised horse
        run: |
          npm ci --no-audit --no-fund
          npm --prefix game-sources/horse-jumping-race ci --no-audit --no-fund
          npm --prefix game-sources/horse-jumping-race run build
          rm -rf games/horse-jumping-race
          mkdir -p games/horse-jumping-race
          cp -R game-sources/horse-jumping-race/dist/. games/horse-jumping-race/
          npm run build
      - name: Core logic and existing platform regression tests
        run: |
          npm --prefix game-sources/horse-jumping-race test
          node tests/horse-race-host.test.cjs
          npm run test:unit
          node tests/school-api.cjs
          node tests/game-session.cjs
          node tests/game-modes.cjs
          npm run check:js
          node scripts/smoke-check.js
      - name: Browser modes through actual host and WebGL engine
        run: |
          npx --no-install playwright install --with-deps chromium
          node tests/horse-race-browser.cjs
      - name: Confirm only horse and cache key changed
        run: |
          git diff --check
          test -z "$(git diff --name-only -- supabase/ js/core.js js/horse-race-host.js js/mm-host.js js/camel-race-host.js)"
          test -f public/games/horse-jumping-race/game.js
          cmp games/horse-jumping-race/game.js public/games/horse-jumping-race/game.js
          cmp game-sources/horse-jumping-race/dist/game.js games/horse-jumping-race/game.js
          test -f public/games/qatar-camel-race/index.html
          test -f public/games/muhimmat-almaarifa/index.html
      - name: Save passing review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: horse-v11-integration-evidence
          path: |
            .horse-review/results/
            game-sources/horse-jumping-race/dist/BUILD_INFO.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit reviewed source and compiled production assets to REVIEW branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'review/horse-v11-safe-20261117'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/classroom-auth.test.cjs game-sources/horse-jumping-race/index.html game-sources/horse-jumping-race/package.json game-sources/horse-jumping-race/src game-sources/horse-jumping-race/tools games/horse-jumping-race public/games/horse-jumping-race js/school.js public/js/school.js index.html public/index.html
          git diff --cached --check
          git commit -m 'Prepare horse jumping race v1.1 with safe school bridge and verified 3D motion'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/review/horse-v11-safe-20261117
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git rev-parse HEAD