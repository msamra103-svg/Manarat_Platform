<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Football animation inspector (developer only)</title>
<style>
  :root { --bg:#20252e; --panel:#11151bee; --ink:#e9edf2; --mute:#9aa6b4; --acc:#e5c36b; --ok:#46d18a; --bad:#ff5d5d; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.45 system-ui,Segoe UI,Tahoma,sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  #ui { position:absolute; inset:10px auto auto 10px; width:290px; max-height:calc(100% - 20px); overflow:auto; background:var(--panel); border:1px solid #ffffff22; border-radius:10px; padding:10px 12px; }
  #ui h1 { font-size:14px; margin:0 0 6px; color:var(--acc); }
  #ui label { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:5px 0; }
  #ui select,#ui input[type=range] { width:150px; }
  #ui .row { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
  #ui button { background:#ffffff14; color:var(--ink); border:1px solid #ffffff2a; border-radius:7px; padding:5px 8px; cursor:pointer; font:inherit; }
  #ui button[aria-pressed=true] { background:var(--acc); color:#111; }
  #hud { position:absolute; inset:auto 10px 10px auto; background:var(--panel); border:1px solid #ffffff22; border-radius:10px; padding:8px 10px; font:12px/1.5 ui-monospace,Consolas,monospace; white-space:pre; min-width:260px; }
  #legend { position:absolute; inset:10px 10px auto auto; background:var(--panel); border-radius:10px; padding:6px 10px; font-size:12px; }
  #legend i { display:inline-block; width:18px; height:4px; margin-inline-end:6px; vertical-align:middle; border-radius:2px; }
  body.capture #ui { display:none; }
  body.capture #hud { inset:8px auto auto 8px; font-size:11px; min-width:0; padding:5px 8px; }
  body.capture #legend { font-size:10px; padding:4px 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Animation inspector · developer only</h1>
  <label>Scenario <select id="scen"></select></label>
  <label>Build <select id="build"><option>athlete</option><option>runner</option><option>keeper</option></select></label>
  <label>Speed (m/s) <input id="speed" type="range" min="0.5" max="7.5" step="0.1" value="5"></label>
  <label>Time scale <input id="slow" type="range" min="0.05" max="1" step="0.05" value="1"></label>
  <div class="row" id="views"></div>
  <div class="row" id="ovl"></div>
  <div class="row"><button id="pause">Pause</button><button id="restart">Restart</button><button id="stepf">+1 frame</button></div>
  <p style="color:var(--mute);margin:6px 0 0">Keys: 1–6 views · space pause · ←/→ frame · [ ] time scale. URL: ?s=run&speed=5&view=side&t=2.1&ovl=bones,feet,knees,dirs&capture=1</p>
</div>
<div id="legend"><div><i style="background:#46d18a"></i>body forward (facing)</div><div><i style="background:#ffd23f"></i>velocity (travel)</div><div><i style="background:#4fc3ff"></i>planted foot · <i style="background:#ff9a3c"></i>swing target</div><div><i style="background:#46d18a"></i>knee bend forward · <i style="background:#ff5d5d"></i>knee bend backward</div></div>
<div id="hud"></div>
<script src="../vendor/three.min.js"></script>
<script src="engine/fb-core.js"></script>
<script src="engine/fb-kit.js"></script>
<script src="engine/fb-char.js"></script>
<script src="engine/fb-rig.js"></script>
<script src="engine/fb-anim.js"></script>
<script src="engine/fb-keeper.js"></script>
<script src="engine/fb-ball.js"></script>
<script src="engine/fb-match.js"></script>
<script src="engine/fb-match-flow.js"></script>
<script>
/* Developer-only animation inspector. It drives the real engine classes (FB.Player / FB.Keeper / FB.Match) with scripted intents and draws
 * diagnostics on top: skeleton, foot targets, knee bend direction, body forward vs velocity. Not linked from the student UI. */
(async () => {
  'use strict';
  const T = THREE, V = T.Vector3, q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
  if (q.get('capture') === '1') document.body.classList.add('capture');
  const SCEN = {
    walk: 'Walk forward', jog: 'Jog forward', run: 'Run forward', sprint: 'Sprint (accelerate)', startstop: 'Start → run → stop',
    turnL: 'Turn left 90°', turnR: 'Turn right 90°', uturn: 'U-turn 180°', curve: 'Curved run', shuffleL: 'Lateral shuffle left', shuffleR: 'Lateral shuffle right',
    backpedal: 'Backpedal (intended)', defend: 'Defender: track ball', kick: 'Kick (side view)', keeper: 'Keeper ready + adjust steps', dive: 'Keeper dive + recovery', match: 'Match: all players (arrows)'
  };
  for (const [k, v] of Object.entries(SCEN)) { const o = document.createElement('option'); o.value = k; o.textContent = v; $('scen').appendChild(o); }
  const st = { scen: q.get('s') || 'run', build: q.get('build') || 'athlete', speed: +(q.get('speed') || 5), slow: +(q.get('slow') || 1), view: q.get('view') || 'three',
    ovl: new Set((q.get('ovl') || 'bones,feet,knees,dirs').split(',').filter(Boolean)), paused: false,
    // scenario frame: every single-player scenario can be placed anywhere on the pitch and facing any direction (?at=0,-12&yaw=180).
    // V21's knee bug only showed away from the centre spot / facing -z, so the frame matters for honest inspection.
    at: (q.get('at') || '0,0').split(',').map(Number), yawF: (+(q.get('yaw') || 0)) * Math.PI / 180 };
  const FR = { x: (lx, lz) => st.at[0] + lx * Math.cos(st.yawF) + lz * Math.sin(st.yawF), z: (lx, lz) => st.at[1] - lx * Math.sin(st.yawF) + lz * Math.cos(st.yawF),
    vx: (vx, vz) => vx * Math.cos(st.yawF) + vz * Math.sin(st.yawF), vz: (vx, vz) => -vx * Math.sin(st.yawF) + vz * Math.cos(st.yawF) };
  $('scen').value = st.scen; $('build').value = st.build; $('speed').value = st.speed; $('slow').value = st.slow;

  const canvas = $('c'), renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1; renderer.shadowMap.enabled = true;
  const scene = new T.Scene(); scene.background = new T.Color('#3b4452');
  scene.add(new T.HemisphereLight('#dde8ff', '#554433', 0.6)); const key = new T.DirectionalLight('#fff3dd', 1.4); key.position.set(3, 6, 4); key.castShadow = true;
  Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); key.shadow.mapSize.set(2048, 2048); scene.add(key, key.target);
  const ground = new T.Mesh(new T.PlaneGeometry(200, 200), new T.MeshStandardMaterial({ color: FB.color('#2f6b3a'), roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const grid = new T.GridHelper(200, 200, 0x7fb08a, 0x4f8a5c); grid.position.y = 0.002; grid.material.transparent = true; grid.material.opacity = 0.35; scene.add(grid);
  const cam = new T.PerspectiveCamera(32, 1, 0.05, 400);

  const base = 'assets/characters', assets = {}, tex = {}, eye = await FB.Char.loadTexture(base + '/textures/eye_brown.png');
  for (const n of ['athlete', 'runner', 'keeper']) { assets[n] = await FB.Char.load(base, n); tex[n] = { skinClean: await FB.Char.loadTexture(`${base}/textures/skin_${n}_clean.jpg`), skinStubble: await FB.Char.loadTexture(`${base}/textures/skin_${n}_stubble.jpg`), eye }; }
  const live = []; // scene objects of the current scenario
  const makeActor = spec => { const a = FB.Char.create(assets[spec.build], { kit: spec.kit, tone: FB.Char.SKIN_TONES[spec.tone || 2], hair: { style: spec.hair || 'crop', color: '#1c1612' }, number: spec.number, keeper: !!spec.keeper, textures: tex[spec.build], seed: spec.seed || 3 }); scene.add(a.root); live.push(a.root); return a; };

  /* ---------- overlays ---------- */
  const ovl = new T.Group(); scene.add(ovl); const pool = { arrows: [], spheres: [], lines: [] }; let used = { arrows: 0, spheres: 0, lines: 0 };
  const arrow = (from, dir, len, color) => { let a = pool.arrows[used.arrows++]; if (!a) { a = new T.ArrowHelper(new V(0, 0, 1), new V(), 1, color, 0.12, 0.07); a.line.material.depthTest = false; a.cone.material.depthTest = false; a.renderOrder = 10; ovl.add(a); pool.arrows.push(a); }
    a.visible = true; a.position.copy(from); a.setDirection(dir.clone().normalize()); a.setLength(Math.max(0.05, len), Math.min(0.14, len * 0.4), 0.07); a.setColor(new T.Color(color)); return a; };
  const sphere = (p, r, color) => { let s = pool.spheres[used.spheres++]; if (!s) { s = new T.Mesh(new T.SphereGeometry(1, 12, 8), new T.MeshBasicMaterial({ depthTest: false, transparent: true, opacity: 0.85 })); s.renderOrder = 11; ovl.add(s); pool.spheres.push(s); }
    s.visible = true; s.position.copy(p); s.scale.setScalar(r); s.material.color.set(color); return s; };
  const beginOverlay = () => { for (const k in pool) for (const o of pool[k]) o.visible = false; used = { arrows: 0, spheres: 0, lines: 0 }; };
  let skelHelpers = [];
  const kneeInfo = (p, S) => { // knee bend direction relative to the body's forward axis
    const r = p.rig, hip = r.joint('thigh' + S, new V()), knee = r.joint('shin' + S, new V()), ank = r.joint('foot' + S, new V());
    const ax = ank.clone().sub(hip), t = knee.clone().sub(hip).dot(ax) / Math.max(1e-6, ax.lengthSq()), onLine = hip.clone().addScaledVector(ax, t), bend = knee.clone().sub(onLine);
    const fwd = new V(Math.sin(p.yaw), 0, Math.cos(p.yaw)); const bendDot = bend.lengthSq() > 1e-8 ? bend.clone().normalize().dot(fwd) : 1;
    const a = hip.clone().sub(knee).normalize(), b = ank.clone().sub(knee).normalize(), flex = Math.PI - Math.acos(Math.max(-1, Math.min(1, a.dot(b))));
    return { knee, bend, bendDot, flex };
  };
  function drawPlayer(p, detail) {
    const hipY = p.rig.joint('hips', new V()).y, o = new V(p.pos.x, hipY + 0.35, p.pos.z);
    if (st.ovl.has('dirs')) { arrow(o, new V(Math.sin(p.yaw), 0, Math.cos(p.yaw)), 0.9, '#46d18a'); if (p.speed > 0.2) arrow(o.clone().setY(hipY + 0.42), new V(p.vel.x, 0, p.vel.z), 0.35 + p.speed * 0.18, '#ffd23f'); }
    if (st.ovl.has('feet') && detail) for (const f of p.feet) { sphere(new V(f.p.x, 0.02, f.p.z), f.swing ? 0.035 : 0.05, f.swing ? '#ff9a3c' : '#4fc3ff'); if (f.swing && f.to) sphere(new V(f.to.x, 0.01, f.to.z), 0.03, '#ff9a3c'); }
    if (st.ovl.has('knees')) for (const S of ['L', 'R']) { const k = kneeInfo(p, S); if (k.bend.length() > 0.004) arrow(k.knee, k.bend, 0.25, k.bendDot >= 0 ? '#46d18a' : '#ff5d5d'); }
  }
  /* ---------- scenarios ---------- */
  let actors = [], match = null, simT = 0, ball = null, ballM = null, kickInfo = null, metrics = null;
  function clearScene() { for (const r of live) scene.remove(r); live.length = 0; for (const h of skelHelpers) scene.remove(h); skelHelpers = []; actors = []; match = null; if (ballM) { scene.remove(ballM); ballM = null; } }
  function mkPlayer(build, kit, keeper) { const a = makeActor({ build, kit, keeper, number: keeper ? 1 : 10, seed: 3 }); const p = keeper ? new FB.Keeper(a) : new FB.Player(a); p.id = 'X'; return p; }
  function setup() {
    clearScene(); simT = 0; kickInfo = null; metrics = { slide: 0, nan: 0, backward: 0, frames: 0, kneeBack: 0, kneeMax: 0 };
    const s = st.scen;
    if (s === 'match') {
      match = new FB.Match({ makeActor: spec => makeActor(spec), seed: 7, mode: 'standard', difficulty: 1 }); match.begin(0, 'standard', 1); actors = match.players;
      ballM = new T.Mesh(new T.SphereGeometry(0.11, 20, 14), new T.MeshStandardMaterial({ color: '#f4f4f0' })); scene.add(ballM);
    } else {
      const keeper = s === 'keeper' || s === 'dive'; const p = mkPlayer(keeper ? 'keeper' : st.build, keeper ? 'keeperHome' : 'home', keeper); p.teleport(st.at[0], st.at[1], keeper ? 0 : st.yawF); actors = [p];
      if (s === 'kick' || s === 'defend' || s === 'dive') { ballM = new T.Mesh(new T.SphereGeometry(0.11, 20, 14), new T.MeshStandardMaterial({ color: '#f4f4f0' })); ballM.castShadow = true; scene.add(ballM); }
      if (s === 'kick') { ball = new V(FR.x(0, 0), 0.11, FR.z(0, 0)); ballM.position.copy(ball); p.teleport(FR.x(-0.35, -3.2), FR.z(-0.35, -3.2), st.yawF + 0.12); }
    }
    if (st.ovl.has('bones')) for (const p of actors.slice(0, s === 'match' ? 0 : 1)) { const h = new T.SkeletonHelper(p.actor.root); h.material.depthTest = false; h.material.linewidth = 2; h.renderOrder = 9; scene.add(h); skelHelpers.push(h); }
  }
  function intent(p, t) { // scripted intents per scenario (world velocity + optional facing)
    const sp = st.speed, s = st.scen;
    switch (s) {
      case 'walk': return [0, Math.min(sp, 1.5)]; case 'jog': return [0, Math.min(sp, 3.2)]; case 'run': return [0, sp];
      case 'sprint': return [0, t < 0.6 ? 0 : 7.2];
      case 'startstop': return [0, t < 0.8 ? 0 : t < 3.6 ? sp : 0];
      case 'turnL': case 'turnR': { const d = s === 'turnL' ? 1 : -1; return t < 1.6 ? [0, sp] : [d * sp, 0]; }
      case 'uturn': return t < 1.8 ? [0, sp] : [0, -sp];
      case 'curve': { const a = t * 0.7; return [Math.sin(a) * sp, Math.cos(a) * sp]; }
      case 'shuffleL': case 'shuffleR': { const d = s === 'shuffleL' ? 1 : -1, v = Math.min(sp, 2.6) * (Math.floor(t / 1.6) % 2 ? -1 : 1); return [d * v, 0, 0]; }
      case 'backpedal': return [0, -Math.min(sp, 2.6), 0];
      case 'defend': { const bx = Math.sin(t * 0.7) * 4, bz = 6 + Math.cos(t * 0.45) * 3; ballM.position.set(bx, 0.11, bz); return null; }
      default: return [0, 0];
    }
  }
  function stepSim(dt) {
    simT += dt; const s = st.scen;
    if (s === 'match') {
      match.update(dt); ballM.position.copy(match.ball.p);
      if (match.passReady && match.state === 'build') match.pass(['S', 'W1', 'W2'][Math.floor(simT) % 3]);
      if (match.state === 'aim' && match.stateT > 0.8) match.shoot({ x: 0.4, y: 0.4, power: 0.75 });
      if (match.state === 'frozen') match.resolve({ outcome: 'goal' });
      if (match.state === 'outcome' && match.stateT > 2.5) { match.begin(1, 'standard', 1); }
    } else if (s === 'kick') {
      const p = actors[0];
      const lz = (p.pos.x - st.at[0]) * Math.sin(st.yawF) + (p.pos.z - st.at[1]) * Math.cos(st.yawF);
      if (!p.kickBusy() && !kickInfo) { if (lz < -1.6) p.setIntent(FR.vx(0, 3.0), FR.vz(0, 3.0)); else { kickInfo = { t: simT }; p.startKick({ foot: 'R', ball: ball.clone(), dir: new V(Math.sin(st.yawF), 0, Math.cos(st.yawF)), power: 0.85, loft: 0.08, type: 'shot', onContact: i => { kickInfo.contact = simT; kickInfo.foot = i.footSpeed; } }); } }
      if (kickInfo && kickInfo.contact) { const d = (simT - kickInfo.contact) * 18; ballM.position.set(FR.x(0, d), 0.11 + Math.min(0.6, (simT - kickInfo.contact) * 1.2), FR.z(0, d)); }
      p.update(dt);
    } else if (s === 'keeper') { const p = actors[0]; p.crouch = 1; p.armsReady = 1; const x = st.at[0] + Math.sin(simT * 0.9) * 1.4; p.setIntent((x - p.pos.x) * 2.2, 0, 0); p.update(dt); }
    else if (s === 'dive') {
      const p = actors[0]; p.crouch = 1; p.armsReady = 1;
      if (!p._dv && simT > 0.8) { const tgt = new V(st.at[0] + 2.3, 0.9, st.at[1] + 0.15); p.ballRef = ballM.position; ballM.position.copy(tgt).add(new V(0, 0, 3)); p.startDive({ target: tgt, tReach: 0.55 }); p._dv = simT; }
      if (p._dv) { const k = Math.min(1, (simT - p._dv) / 0.55); ballM.position.set(st.at[0] + 2.3, 0.9, st.at[1] + 0.15 + 3 * (1 - k)); } else p.setIntent(0, 0, 0);
      p.update(dt);
    } else {
      const p = actors[0], it = intent(p, simT);
      if (s === 'defend') { const b = ballM.position, tx = b.x * 0.5, tz = b.z - 4.5; FB.steer(p, tx, tz, 4.6, Math.atan2(b.x - p.pos.x, b.z - p.pos.z), 1.0, null); }
      else p.setIntent(FR.vx(it[0], it[1]), FR.vz(it[0], it[1]), it.length > 2 ? it[2] + st.yawF : undefined);
      p.update(dt);
    }
    // metrics: NaN, planted-foot slide, backward travel, knee bend direction
    for (const p of (s === 'match' ? actors : actors.slice(0, 1))) {
      metrics.frames++; if (!isFinite(p.pos.x) || !isFinite(p.yaw)) metrics.nan++;
      if (p.speed > 1.5) { const d = Math.abs(Math.atan2(Math.sin(p.yaw - Math.atan2(p.vel.x, p.vel.z)), Math.cos(p.yaw - Math.atan2(p.vel.x, p.vel.z)))); if (d > 2.1) metrics.backward++; }
      for (const S of ['L', 'R']) { const k = kneeInfo(p, S); if (k.flex > 0.15 && k.bendDot < -0.2) metrics.kneeBack++; metrics.kneeMax = Math.max(metrics.kneeMax, k.flex); }
      if (p.mode === 'dive' || p.mode === 'pose') { for (const f of p.feet) f._last = null; continue; } // dive/pose legs are posed directly, not planted
      for (const f of p.feet) { if (!f.swing) { if (f._last) metrics.slide = Math.max(metrics.slide, Math.hypot(f.p.x - f._last.x, f.p.z - f._last.z)); f._last = { x: f.p.x, z: f.p.z }; } else f._last = null; }
    }
  }
  /* ---------- cameras ---------- */
  const VIEWS = { front: [0, 1.0, 4.6], side: [4.6, 1.0, 0], rear: [0, 1.2, -4.6], three: [3.0, 1.4, 3.6], top: [0.01, 7, 0.4], wide: [9, 5, 9], close: [0.9, 1.35, 1.5], feet: [1.1, 0.35, 1.3], sideR: [-4.2, 1.0, 0.6] };
  for (const [i, k] of Object.keys(VIEWS).entries()) if (i < 9) { const b = document.createElement('button'); b.textContent = (i + 1) + ' ' + k; b.dataset.view = k; b.onclick = () => { st.view = k; sync(); }; $('views').appendChild(b); }
  for (const k of ['bones', 'feet', 'knees', 'dirs']) { const b = document.createElement('button'); b.textContent = k; b.dataset.o = k; b.onclick = () => { st.ovl.has(k) ? st.ovl.delete(k) : st.ovl.add(k); setup(); sync(); }; $('ovl').appendChild(b); }
  function sync() { document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === st.view))); document.querySelectorAll('[data-o]').forEach(b => b.setAttribute('aria-pressed', String(st.ovl.has(b.dataset.o)))); $('pause').textContent = st.paused ? 'Play' : 'Pause'; }
  function placeCamera() {
    const p = actors[0]; let c = new V(0, 0.9, 0); let yaw = 0;
    if (st.scen === 'match') { const b = match.ball.p; c.set(b.x * 0.6, 0, b.z - 4); cam.position.set(c.x + 16, 22, c.z + 26); cam.lookAt(c); return; }
    if (p) { c.set(p.pos.x, 0.9, p.pos.z); if (st.view !== 'top' && st.view !== 'wide') yaw = p.yaw; }
    if (st.scen === 'kick') { c.set((p.pos.x + ball.x) / 2, 0.75, (p.pos.z + ball.z) / 2); yaw = st.yawF; }
    if (st.scen === 'dive') { c.set(st.at[0] + 1.1, 0.7, st.at[1]); yaw = 0; }
    const v = VIEWS[st.view] || VIEWS.three, cs = Math.cos(yaw), sn = Math.sin(yaw);
    const ox = v[0] * cs + v[2] * sn, oz = -v[0] * sn + v[2] * cs; // view offsets are in the character frame so "front" always faces the face
    cam.position.set(c.x + ox, v[1], c.z + oz); cam.lookAt(c.x, st.view === 'top' ? 0 : st.view === 'close' ? 1.2 : st.view === 'feet' ? 0.12 : 0.9, c.z);
    key.position.set(c.x + 3, 6, c.z + 4); key.target.position.set(c.x, 0, c.z);
  }
  function hud() {
    const p = actors[0]; if (!p) return; const lines = [];
    lines.push(`scenario ${st.scen}   t=${simT.toFixed(2)} s   timescale ${st.slow}`);
    if (st.scen !== 'match') {
      const vy = Math.atan2(p.vel.x, p.vel.z), d = p.speed > 0.3 ? Math.round(Math.abs(Math.atan2(Math.sin(p.yaw - vy), Math.cos(p.yaw - vy))) * 180 / Math.PI) : 0;
      const kl = kneeInfo(p, 'L'), kr = kneeInfo(p, 'R');
      lines.push(`speed ${p.speed.toFixed(2)} m/s   facing-vs-travel ${d}°   gait ${p.gait || p.mode}`);
      lines.push(`knee flex L ${(kl.flex * 57.3).toFixed(0)}° ${kl.bendDot >= 0 ? 'fwd' : 'BACK'}   R ${(kr.flex * 57.3).toFixed(0)}° ${kr.bendDot >= 0 ? 'fwd' : 'BACK'}`);
      if (kickInfo && kickInfo.contact) lines.push(`kick contact at ${(kickInfo.contact - kickInfo.t).toFixed(2)} s after start · foot ${kickInfo.foot.toFixed(1)} m/s`);
    }
    lines.push(`max planted-foot slide/frame ${(metrics.slide * 1000).toFixed(1)} mm · NaN ${metrics.nan}`);
    lines.push(`frames moving backward (>120°) ${metrics.backward} / ${metrics.frames} · knee-back frames ${metrics.kneeBack}`);
    $('hud').textContent = lines.join('\n');
  }
  function render() {
    const w = canvas.clientWidth, h = canvas.clientHeight; if (canvas.width !== w || canvas.height !== h) { renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
    beginOverlay(); for (const [i, p] of actors.entries()) drawPlayer(p, st.scen !== 'match' || i < 0);
    placeCamera(); renderer.render(scene, cam); hud();
  }
  const DT = 1 / 120;
