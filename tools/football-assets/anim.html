<!doctype html><meta charset="utf-8"><title>anim viewer</title>
<body style="margin:0;background:#445"><canvas id="c" width="1200" height="700"></canvas>
<script src="../../games/vendor/three.min.js"></script>
<script src="../../games/football/engine/fb-core.js"></script>
<script src="../../games/football/engine/fb-kit.js"></script>
<script src="../../games/football/engine/fb-char.js"></script>
<script src="../../games/football/engine/fb-rig.js"></script>
<script src="../../games/football/engine/fb-anim.js"></script>
<script src="../../games/football/engine/fb-keeper.js"></script>
<script src="../../games/football/engine/fb-ball.js"></script>
<script>
(async()=>{
const q=new URLSearchParams(location.search);const scen=q.get('s')||'idle',T=parseFloat(q.get('t')||'1'),speed=parseFloat(q.get('speed')||'4');
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,700,false);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#3b4452');
scene.add(new THREE.HemisphereLight('#dde8ff','#554433',.55));const key=new THREE.DirectionalLight('#fff3dd',1.5);key.position.set(3,5,4);key.castShadow=true;key.shadow.camera.left=-4;key.shadow.camera.right=4;key.shadow.camera.top=4;key.shadow.camera.bottom=-4;key.shadow.mapSize.set(2048,2048);scene.add(key);scene.add(key.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:'#1f4a26'}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let i=-10;i<=10;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.04,.005,40),new THREE.MeshBasicMaterial({color:'#2d6a38'}));m.position.set(i,0.003,0);scene.add(m);}
const base='../../games/football/assets/characters';const build=q.get('build')||'athlete';
const asset=await FB.Char.load(base,build);
const tex={skinClean:await FB.Char.loadTexture(base+'/textures/skin_'+build+'_clean.jpg'),skinStubble:await FB.Char.loadTexture(base+'/textures/skin_'+build+'_stubble.jpg'),eye:await FB.Char.loadTexture(base+'/textures/eye_brown.png')};
const a=FB.Char.create(asset,{kit:q.get('kit')||'home',tone:FB.Char.SKIN_TONES[2],hair:{style:'crop',color:'#1c1612'},number:10,label:'ABU',keeper:build==='keeper',textures:tex,seed:3});scene.add(a.root);
const P=(scen==='dive'||scen==='keeper')?new FB.Keeper(a):new FB.Player(a);window.P=P;
const ballM=new THREE.Mesh(new THREE.SphereGeometry(.11,24,16),new THREE.MeshStandardMaterial({color:'#f4f4f0',roughness:.5}));ballM.castShadow=true;scene.add(ballM);
const cam=new THREE.PerspectiveCamera(30,1200/700,.05,80);
const dt=1/120;const V=THREE.Vector3;
const ball=new V(0,0.11,1.2);ballM.position.copy(ball);
let focus=new V(0,.9,0);
function run(T){let t=0;
  if(scen==='run'||scen==='idle'||scen==='turn'){P.teleport(0,0,0,0);while(t<T){let vx=0,vz=scen==='idle'?0:speed;if(scen==='turn'){const a=t*0.9;vx=Math.sin(a)*speed;vz=Math.cos(a)*speed}P.setIntent(vx,vz);P.update(dt);t+=dt;}}
  if(scen==='stop'){P.teleport(0,0,0,0);while(t<T){P.setIntent(0,t<1.5?speed:0);P.update(dt);t+=dt;}}
  if(scen==='kick'){const foot=q.get('foot')||'R',loft=parseFloat(q.get('loft')||'0.1'),pw=parseFloat(q.get('pw')||'0.9');ball.set(0,0.11,1.2);P.teleport(0,-0.6,0,0);let fired=false;
    P.startKick({foot,ball:ball.clone(),dir:new V(0,0,1),power:pw,loft,onContact:i=>{fired=true;}});
    while(t<T){P.update(dt);t+=dt;} if(fired){ballM.position.set(0,0.11,1.2+Math.max(0,(t-(0.26+0.14-0.045*pw))*12));} focus.set(0,.8,0.5);}
  if(scen==='keeper'){P.teleport(0,0,0,0);P.setIntent(0,0);while(t<T){const sx=Math.sin(t*1.2)*1.2;P.setIntent((sx-P.pos.x)*2,0,0);P.update(dt);t+=dt;}}
  if(scen==='dive'){const tx=parseFloat(q.get('tx')||'2.2'),ty=parseFloat(q.get('ty')||'1.2'),td=parseFloat(q.get('td')||'0.5');P.teleport(0,0,0,0);P.setIntent(0,0);for(let i=0;i<60;i++){P.update(dt);}
    const tgt=new V(tx,ty,0.1);P.ballRef=ballM.position;ballM.position.copy(tgt).add(new V(0,0,0.15));P.startDive({target:tgt,tReach:td});while(t<T){P.update(dt);t+=dt;} focus.set(tx/2,.6,0);}
  if(scen==='pose'){P.teleport(0,0,0,0);P.startPose(q.get('kind')||'celebrate',{});while(t<T){P.update(dt);t+=dt;}}
}
run(T);
const views={wide:[0,1.6,7,0,.7],front:[0,1.1,5,0,.9],three:[2.6,1.3,3.6,0,.9],side:[5,1.0,0,0,.9],back:[0,1.2,-5,0,.9],top:[0.1,6,0.5,0,0.4]};
const vv=views[q.get('view')||'three'];const px=scen==='dive'?parseFloat(q.get('tx')||'2.2')*0.5:P.pos.x,pz=P.pos.z;
cam.position.set(vv[0]+px,vv[1],vv[2]+pz);cam.lookAt(vv[3]+px,vv[4],vv[5]!==undefined?vv[5]+pz:pz+ (scen==='kick'?0.5:0));
key.position.set(px+3,5,pz+4);key.target.position.set(px,0,pz);
window.shot=()=>{renderer.render(scene,cam);return true};window.ready=true;shot();
})();
</script>
