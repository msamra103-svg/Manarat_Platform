<!doctype html><meta charset="utf-8"><title>char viewer</title>
<body style="margin:0;background:#445"><canvas id="c" width="1200" height="700"></canvas>
<script src="../../games/vendor/three.min.js"></script>
<script src="../../games/football/engine/fb-core.js"></script>
<script src="../../games/football/engine/fb-kit.js"></script>
<script src="../../games/football/engine/fb-char.js"></script>
<script>
(async()=>{
const q=new URLSearchParams(location.search);const build=q.get('build')||'athlete',kit=q.get('kit')||'home';
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,700,false);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#3b4452');
scene.add(new THREE.HemisphereLight('#dde8ff','#554433',.55));const key=new THREE.DirectionalLight('#fff3dd',1.5);key.position.set(3,5,4);key.castShadow=true;scene.add(key);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:'#1f4a26'}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const base='../../games/football/assets/characters';
const asset=await FB.Char.load(base,build);
const tex={skinClean:await FB.Char.loadTexture(base+'/textures/skin_'+build+'_clean.jpg'),skinStubble:await FB.Char.loadTexture(base+'/textures/skin_'+build+'_stubble.jpg'),eye:await FB.Char.loadTexture(base+'/textures/eye_brown.png')};
const a=FB.Char.create(asset,{kit,tone:q.get('tone')||FB.Char.SKIN_TONES[2],stubble:q.get('beard')==='1',hair:{style:q.get('hair')||'crop',color:'#1c1612'},number:q.get('num')||10,label:'ABU',keeper:build==='keeper',textures:tex,seed:3});
scene.add(a.root);if(q.get('lod')==='1')a.setLOD(1);
window.actor=a;if(q.get('eyebasic')){a.parts.eyes.material=new THREE.MeshBasicMaterial({map:tex.eye});}if(q.get('eyez'))a.parts.eyes.position.z=parseFloat(q.get('eyez'));if(q.get('nohair')&&a.parts.hair)a.parts.hair.visible=false;
const cam=new THREE.PerspectiveCamera(30,1200/700,.05,50);
const views={front:[0,1.0,4.6,0,.9],three:[2.4,1.2,3.6,0,.9],side:[4.4,1.0,0,0,.9],back:[0,1.0,-4.6,0,.9],face:[.25,1.69,.75,0,1.66],torso:[-.7,1.3,1.8,0,1.15],legs:[1.2,.5,2,0,.45]};
const v=views[q.get('view')||'front'];cam.position.set(v[0],v[1],v[2]);cam.lookAt(v[3],v[4],0);
window.shot=()=>{renderer.render(scene,cam);return true};window.ready=true;shot();
})();
</script>
